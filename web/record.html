<!doctype html>
<html><head><meta charset="utf-8"><title>Record Bureaucracy Outcome Accelerator Demo</title><style>
body{margin:0;background:#080b10;color:white;font:16px system-ui;display:grid;place-items:center;min-height:100vh}canvas{max-width:96vw;max-height:82vh;border:1px solid #24324a;border-radius:12px}button{margin-top:14px;padding:12px 22px;border:0;border-radius:999px;font-weight:800;font-size:16px}#status{margin-top:8px;color:#9eb6dc}
</style></head><body><div><canvas id="c" width="1280" height="720"></canvas><div style="text-align:center"><button id="go">Record live MCP demo</button><div id="status">Ready</div></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),statusEl=document.getElementById('status');let sid=null,seq=1,caseId=null,initial=null,reroute=null;
async function rpc(method,params={}){const h={'Content-Type':'application/json','Accept':'application/json, text/event-stream','MCP-Protocol-Version':'2025-11-25'};if(sid)h['Mcp-Session-Id']=sid;const r=await fetch('/mcp',{method:'POST',headers:h,body:JSON.stringify({jsonrpc:'2.0',id:seq++,method,params})});if(method==='initialize')sid=r.headers.get('Mcp-Session-Id');const b=await r.json();if(b.error)throw Error(b.error.message);return b.result}
async function liveData(){await rpc('initialize',{protocolVersion:'2025-11-25',capabilities:{},clientInfo:{name:'demo-recorder',version:'1'}});let r=await rpc('tools/call',{name:'break_bureaucracy',arguments:{goal:'Get the city to add one more waste bin to our residential area.',known_facts:['The municipal waste official agreed to add one bin.'],constraints:['Use the smallest safe next action']}});initial=r.structuredContent;caseId=initial.case_id;let a=await fetch('/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,case_id:caseId,fingerprint:initial.action_fingerprint})});if(!a.ok)throw Error('approval failed');r=await rpc('tools/call',{name:'resume_case',arguments:{case_id:caseId}});r=await rpc('tools/call',{name:'record_outcome',arguments:{case_id:caseId,outcome:'The official agreed, but the bin has not been physically placed yet.',verified:false}});reroute=r.structuredContent}
function bg(){x.fillStyle='#090c12';x.fillRect(0,0,c.width,c.height);const g=x.createRadialGradient(180,0,30,180,0,800);g.addColorStop(0,'#20375f');g.addColorStop(1,'#090c12');x.fillStyle=g;x.fillRect(0,0,c.width,c.height)}
function wrap(t,px,py,max,lh){const words=String(t||'').split(/\s+/);let line='',y=py;for(const w of words){const test=line?line+' '+w:w;if(x.measureText(test).width>max&&line){x.fillText(line,px,y);line=w;y+=lh}else line=test}if(line)x.fillText(line,px,y);return y}
function text(t,y,size=34,color='#f7f8fb',weight=700,max=1080){x.font=`${weight} ${size}px system-ui`;x.fillStyle=color;wrap(t,100,y,max,size*1.28)}
function pill(t,y,color='#17335c'){x.font='700 24px system-ui';const w=x.measureText(t).width+40;x.fillStyle=color;x.beginPath();x.roundRect(100,y-30,w,46,23);x.fill();x.fillStyle='#b8d5ff';x.fillText(t,120,y)}
function footer(){x.font='500 20px system-ui';x.fillStyle='#7f91aa';x.fillText('Goal → Bottleneck → Controller → Smallest Safe Action → Verify → Re-route',100,675)}
function frame(t){bg();if(t<6){text('Bureaucracy Outcome Accelerator',250,56);text('Nebius × NVIDIA · self-hosted MCP · live stateful demo',330,28,'#9fc5ff',600);footer();return}if(t<15){pill('THE PROBLEM',125);text('Bureaucracy is often a dependency problem — not an information problem.',200,42);text('People need to know what blocks the outcome now, who controls it, and whether the last action changed reality.',330,29,'#bdc9dc',500);footer();return}if(t<24){pill('LIVE GOAL',120);text('Get the city to add one more waste bin to our residential area.',205,42);text('Known fact: the responsible municipal official agreed to add one.',350,30,'#a9b8cc',500);text('Agreement is not treated as success.',455,34,'#ffcf7a',800);footer();return}if(t<47){pill(initial?.status||'WAITING_APPROVAL',95);text('CURRENT BLOCKER',160,21,'#8db8ff',700);text(initial?.blocker,205,29);text('WHO CONTROLS IT',340,21,'#8db8ff',700);text(initial?.controller,385,27);text('SMALLEST SAFE NEXT ACTION',480,21,'#8db8ff',700);text(initial?.next_action,525,27);footer();return}if(t<58){pill('VERIFY REALITY',120,'#49331d');text('The official promised the bin.',205,38);text('But the bin is not physically there yet.',300,46,'#ffca78',800);text('Result: NOT VERIFIED → reroute the case.',420,34,'#b9c8dc',650);footer();return}if(t<78){pill(reroute?.status||'WAITING_APPROVAL',100,'#40305f');text('NEW NEXT ACTION',180,21,'#b99cff',700);text(reroute?.next_action,230,31);text('The agent changes the route instead of repeating the original advice.',430,30,'#c3cce0',500);text('Case state is preserved across MCP calls.',540,28,'#8db8ff',650);footer();return}if(t<91){pill('ARCHITECTURE',110);text('MCP 2025-11-25 · Streamable HTTP',190,38);text('Session state · 4 tools · external Human Gate',290,34,'#bfcbe0',600);text('18 / 18 automated protocol & workflow tests PASS',400,38,'#9fe3b0',800);text('No gated Alexa+ preview tooling required.',500,29,'#a8b8d0',500);footer();return}pill('THE PRODUCT',110);text('What is blocking me now?',190,42);text('What should I do now?',285,42);text('Did it work?',380,42);text('The agent holds the process so the person does not have to.',510,32,'#9fc5ff',650);footer()}
async function record(){document.getElementById('go').disabled=true;statusEl.textContent='Calling live MCP…';await liveData();statusEl.textContent='Recording 80 seconds…';const stream=c.captureStream(30);const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5000000});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{const b=new Blob(chunks,{type:mime});const saved=await fetch('http://127.0.0.1:8767/save',{method:'POST',headers:{'Content-Type':'video/webm'},body:b});if(!saved.ok)throw Error('save failed');statusEl.textContent='Done — video saved locally';};const start=performance.now();function tick(now){const t=(now-start)/1000;frame(t*1.25);if(t<80)requestAnimationFrame(tick);else rec.stop()}rec.start(1000);requestAnimationFrame(tick)}
document.getElementById('go').onclick=()=>record().catch(e=>{statusEl.textContent='Error: '+e.message;document.getElementById('go').disabled=false});frame(0);
</script></body></html>
